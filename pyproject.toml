[project]
name = "project3-kms"
version = "0.1.0"
description = "A production-grade KMS RAG engine for institutional course repository synthesis and verifiable academic retrieval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "boto3>=1.43.40",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "pymupdf4llm>=1.28.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
