services:
  # Postgres är inte en emulator - det är samma databasmotor som körs i produktion,
  # bara i en lokal container istället för en molntjänst. Ingen skillnad i beteende.
  postgres:
    image: postgres:18
    container_name: kms_postgres
    environment:
      POSTGRES_USER: kms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # bara lokal dev, aldrig riktiga secrets här
      POSTGRES_DB: kms_db
    ports:            # host:container - byt vänster sida vid portkonflikt
      - "5436:5432"   # 5432=standard (upptagen internt av data-lake), 5435=glossary, 5436=kms
    volumes:
      - postgres_data:/var/lib/postgresql   # inte /data i slutet, V18+ hanterar version-undermappen själv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kms_user -d kms_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # LocalStack ÄR en emulator - AWS S3 går inte att ladda ner och köra lokalt,
  # det är en molntjänst. LocalStack låtsas prata S3-API't tillräckligt bra
  # för utveckling, utan AWS-konto eller kostnad.
  localstack:
    image: localstack/localstack:4.4.0 # Pinnad, sista fria community versionen INNAN konto requirements ändrades
    container_name: kms_localstack
    environment:
      - SERVICES=s3
      - DEBUG=0
    ports:
      - "4566:4566" # LocalStack Gateway

  # Chroma ÄR vektordatabasen - Egen container så att API't (V4) kan läsa samtidigt som rebuild.py skriver.
  # Samma mönster som Postgres.
  chroma:
    image: chromadb/chroma:1.5.9 # Pinnad version - Python klienten låses till samma version
    container_name: kms_chroma
    ports:
      - "8006:8000"
    volumes:
      - chroma_data:/data   # 1.x sparar i /data, inte /chroma/chroma som i 0.x-guider
    healthcheck:
      # Imagen saknar curl - bash öppnar en TCP-anslutning mot porten istället
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  chroma_data: